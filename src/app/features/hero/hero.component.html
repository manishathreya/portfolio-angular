<div class="relative min-h-screen flex items-center pt-16">
  <!-- Ambient service-topology backdrop -->
  <div class="absolute inset-0 grid-fade pointer-events-none"></div>
  <svg class="absolute inset-0 w-full h-full opacity-40 pointer-events-none" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
    <line x1="120" y1="120" x2="340" y2="220" stroke="#46C7B8" stroke-width="1" stroke-opacity="0.35"></line>
    <line x1="340" y1="220" x2="620" y2="140" stroke="#46C7B8" stroke-width="1" stroke-opacity="0.35"></line>
    <line x1="340" y1="220" x2="420" y2="420" stroke="#46C7B8" stroke-width="1" stroke-opacity="0.35"></line>
    <line x1="620" y1="140" x2="860" y2="260" stroke="#46C7B8" stroke-width="1" stroke-opacity="0.35"></line>
    <line x1="420" y1="420" x2="700" y2="470" stroke="#46C7B8" stroke-width="1" stroke-opacity="0.35"></line>
    <line x1="700" y1="470" x2="860" y2="260" stroke="#46C7B8" stroke-width="1" stroke-opacity="0.35"></line>

    <circle cx="120" cy="120" r="4" fill="#46C7B8" class="animate-pulseNode"></circle>
    <circle cx="340" cy="220" r="5" fill="#F2A93B" class="animate-pulseNode"></circle>
    <circle cx="620" cy="140" r="4" fill="#46C7B8" class="animate-pulseNode"></circle>
    <circle cx="860" cy="260" r="5" fill="#F2A93B" class="animate-pulseNode"></circle>
    <circle cx="420" cy="420" r="4" fill="#46C7B8" class="animate-pulseNode"></circle>
    <circle cx="700" cy="470" r="4" fill="#46C7B8" class="animate-pulseNode"></circle>
  </svg>

  <div class="relative max-w-6xl mx-auto px-6 py-24 w-full">
    <p class="font-mono text-sm text-signal">
      <span class="text-wire">$</span> whoami<span class="animate-blink text-signal">_</span>
    </p>

    <h1 class="mt-4 text-4xl sm:text-5xl md:text-6xl font-display font-extrabold text-slate-50 leading-tight">
      {{ info.name }}
    </h1>

    <p class="mt-3 font-mono text-base md:text-lg text-wire">
      &gt; {{ info.role }} — Spring Boot · Angular · Cloud-Native Systems
    </p>

    <p class="mt-6 max-w-2xl text-slate-300 font-body leading-relaxed">
      {{ info.summary }}
    </p>

    <div class="mt-9 flex flex-wrap items-center gap-4">
      <a
        href="#projects"
        class="inline-flex items-center gap-2 px-5 py-2.5 rounded-md bg-signal text-ink font-body font-semibold text-sm hover:bg-signal-soft transition-colors duration-200"
      >
        View Projects
      </a>
      <a
        href="#contact"
        class="inline-flex items-center gap-2 px-5 py-2.5 rounded-md border border-white/15 text-slate-200 font-body font-semibold text-sm hover:border-wire hover:text-wire transition-colors duration-200"
      >
        Get in Touch
      </a>
    </div>

    <div class="mt-8 flex items-center gap-3">
      <a
        *ngFor="let social of info.socials"
        [href]="social.url"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="social.label"
        class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center text-slate-400 hover:text-signal hover:border-signal/50 transition-colors duration-200"
      >
        <app-icon [name]="social.icon" class="w-[18px] h-[18px]"></app-icon>
      </a>
    </div>

    <a href="#skills" class="mt-16 inline-flex items-center gap-2 font-mono text-xs text-ink2 hover:text-wire transition-colors">
      scroll <app-icon name="arrow-down" class="w-3.5 h-3.5"></app-icon>
    </a>
  </div>
</div>
